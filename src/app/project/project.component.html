<div class="projects-section section-padding">
  <div class="container">
    <h2 class="section-title text-center mb-5">My Projects</h2>
    
    <div class="row">
      <div class="col-lg-3 mb-4">
        <div class="folders-container">
          <div class="folder-item" (click)="onFolderClick('backend')" [class.active]="activeFolder === 'backend'">
            <app-folder folderName="Backend" [isClicked]="activeFolder === 'backend'"></app-folder>
          </div>
          <div class="folder-item" (click)="onFolderClick('frontend')" [class.active]="activeFolder === 'frontend'">
            <app-folder folderName="Frontend" [isClicked]="activeFolder === 'frontend'"></app-folder>
          </div>
        </div>
      </div>
      
      <div class="col-lg-9">
        <div *ngIf="!activeFolder" class="welcome-message">
          <div class="text-center">
            <i class="bi bi-folder2-open display-1 text-primary mb-3"></i>
            <h3>Select a Folder</h3>
            <p class="text-muted">Choose a folder to explore my projects in that category</p>
          </div>
        </div>
        
        <div *ngIf="activeFolder" class="projects-content">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>{{ activeFolder === 'backend' ? 'Backend' : 'Frontend' }} Projects</h3>
            <button class="btn btn-outline-primary" (click)="goBack()">
              <i class="bi bi-arrow-left me-2"></i>Back
            </button>
          </div>
          
          <div class="work-in-progress text-center">
            <i class="bi bi-tools display-1 text-warning mb-3"></i>
            <h4>Work in Progress</h4>
            <p class="text-muted">My projects are currently being finalized and will be uploaded once they are completed. Stay tuned for updates!</p>
            <div class="progress-indicator mt-4">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
